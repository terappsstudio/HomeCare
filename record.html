<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>HomeCare v3.1</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#2E8B57">

</head>

<body>

<div id="appContainer">

<header>

<div class="logo" id="homeBtn">
        🏠 HomeCare
    </div>

    <button id="settingBtn">
        ⚙️
    </button>

</header>

<section id="summary">

    <div class="summaryCard">
        <span class="title">오늘 교체</span>
        <span id="todayCount">0개</span>
    </div>

    <div class="summaryCard">
        <span class="title">이번주 교체</span>
        <span id="weekCount">0개</span>
    </div>

</section>

<div id="mainContainer">

    <div id="leftArea">

  <section id="toolbar">

    <div id="spaceList"></div>

    <button id="addSpaceBtn">
        ＋
    </button>

</section>

    </div>

</div>

 <section id="mapSection">

    <div id="uploadPlaceholder">
        <label for="imageLoader" class="uploadBtn">
            🗺️ 도면 이미지 불러오기
        </label>

        <input type="file" 
               id="imageLoader" 
               accept="image/*" 
               style="display:none;">
    </div>


   <div id="mapContainer">

    <div id="mapContent">

        <img id="floorImage" draggable="false">

        <div id="markerLayer"></div>

    </div>

<div id="zoomControls">

    <button id="zoomInBtn">＋</button>

    <button id="zoomPercentBtn">100%</button>

    <button id="zoomOutBtn">－</button>

</div>

</div>


</section>

      


  <div id="rightArea">

    <section id="listSection">

        <h2>설치 목록</h2>

        <div id="itemList"></div>

    </section>


    <section id="dueSection">

<h2>교체 예정</h2>

<select id="dueFilter">
    <option value="all">전체 제품</option>
</select>

<select id="roomFilter">
    <option value="all">전체 위치</option>
</select>

<div id="dueList"></div>

</section>


</div>


<!-- 추가 팝업 -->

<div id="popup" class="popup hidden">

    <div class="popupBox">

        <h2>

            제품 등록

        </h2>

        <label>

            제품

            <select id="itemType">

                <option value="deodorizer">
                    🌿 방향제
                </option>

                <option value="dehumidifier">
                    💧 제습제
                </option>

                <option value="deodorizer2">
                    🧸 탈취제
                </option>

                <option value="etc">
                    📦 기타
                </option>

            </select>

        </label>


       <label>

    위치

    <select id="locationName">

    </select>

</label>

        <label>

            설치일

            <input
                type="date"
                id="installDate">

        </label>

        <label>

    상세 위치

    <input
        type="text"
        id="detailLocation"
        placeholder="예: 신발장 1번째 칸, 장롱 왼쪽 구석">

</label>

        <label>

            교체주기(일)

            <input
                type="number"
                id="replaceDays"
                value="40">

        </label>

        <div class="popupButtons">

            <button id="saveBtn">

                저장

            </button>

            <button id="cancelBtn">

                취소

            </button>

        </div>

    </div>

</div>





<!-- 수정 팝업 -->

<div id="editPopup" class="popup hidden">

    <div class="popupBox">

        <h2>

            제품 수정

        </h2>

        <label>

            제품

            <select id="editType">

                <option value="deodorizer">
                    🌿 방향제
                </option>

                <option value="dehumidifier">
                    💧 제습제
                </option>

                <option value="deodorizer2">
                    🧸 탈취제
                </option>

                <option value="etc">
                    📦 기타
                </option>

            </select>

        </label>

        <label>

    위치

    <select id="editLocation">

    </select>

  <label>

    상세위치

    <input
        type="text"
        id="editDetailLocation"
        placeholder="예: 책상 위, 선반 안">

</label>

</label>

        <label>

            설치일

            <input
                type="date"
                id="editInstall">

        </label>

        <label>

            교체주기

            <input
                type="number"
                id="editCycle">

        </label>

        <div class="popupButtons">

            <button id="editSaveBtn">

                저장

            </button>

            <button id="deleteBtn">

                삭제

            </button>

            <button id="editCancelBtn">

                취소

            </button>

        </div>

    </div>

</div>

</div>

<!-- 설정 팝업 -->

<div id="settingPopup" class="popup hidden">

    <div class="popupBox">

        <h2>🛠️️ 설정</h2>

        <button id="floorManageBtn">
    🏘️ 공간 관리
</button>

   <!--<button id="productManageBtn">
  //    ⭐  공간 관리[였지만 잠시 봉인]
//</button>-->

<button id="roomManageBtn">
    🐳 룸 설정
</button>

<button id="markerManageBtn">
    🏷️ 마커 관리
</button>

        <button id="settingCloseBtn">
            닫기
        </button>

  <hr>

        <p class="developer">

    🏠 HomeCare<br>

    Version 3.1<br><br>

    Developed by TER<br>

    © 2026 TER<br>

    All Rights Reserved.

</p>

    </div>

</div>   <!-- settingPopup 끝 -->


<!-- ===============================
공간 관리 팝업
=============================== 

<div id="spaceManagePopup" class="popup hidden">

    <div class="popupBox">

        <h2>🏠 공간 관리</h2>

        <div id="spaceManageList">

        </div>

        <button id="spaceManageCloseBtn">
            닫기
        </button>

    </div>

</div>
-->


<!-- ===============================
     🏘️ 공간 관리 팝업
=============================== -->

<div id="floorManagePopup" class="popup hidden">

    <div class="popupBox">

        <h2>🏘️ 공간 관리</h2>

        <div id="spaceManageList">

</div>

        <button id="floorManageCloseBtn">
            닫기
        </button>


    </div>

</div>

<!-- ===============================
     🏠 공간 상세 관리 팝업
=============================== -->

<div id="spaceDetailPopup" class="popup hidden">

<div class="popupBox">

    <h2 id="spaceDetailTitle">
        🏠 공간 관리
    </h2>

    <div class="spaceManageButtons">

        <button id="spaceImageChangeBtn">
            🖼️ 도면 변경
        </button>

        <button id="spaceImageDeleteBtn">
            🗑️ 도면 삭제
        </button>

        <button id="spaceNameChangeBtn">
            ✏️ 이름 변경
        </button>

        <button id="spaceDeleteBtn">
            🗑️ 공간 삭제
        </button>

    </div>

    <button id="spaceDetailCloseBtn">
        닫기
    </button>

    <input
        id="spaceImageChangeInput"
        type="file"
        accept="image/*"
        hidden>

</div>

</div>

<!-- 제품 관리 팝업 

<div id="productPopup" class="popup hidden">

    <div class="popupBox">

        <h2>⭐ 공간 관리</h2>

        <div id="productList"></div>

        <button id="productCloseBtn">
            닫기
        </button>

    </div>

</div>-->

<!-- 공간 추가 팝업 -->

<div id="spacePopup" class="popup hidden">

    <div class="popupBox">

        <h2>🏠 새 공간 추가</h2>


        <input 
            id="spaceNameInput"
            type="text"
            placeholder="공간 이름">

            <img
    id="spacePreview"
    class="hidden"
    src=""
    alt="도면 미리보기">


        <label>
            🗺️ 도면 이미지 선택
        </label>

        <input 
            id="spaceImageInput"
            type="file"
            accept="image/*">


        <button id="spaceSaveBtn">
            저장
        </button>


        <button id="spaceCloseBtn">
            닫기
        </button>


    </div>

</div>

<!-- 룸 관리 팝업 -->

<div id="roomPopup" class="popup hidden">

    <div class="popupBox">

        <h2>🏠 룸 관리</h2>

        <div id="roomList"></div>

        <input 
            id="newRoomName" 
            placeholder="새 방 이름">

        <button id="addRoomBtn">
            ➕ 방 추가
        </button>

        <button id="roomCloseBtn">
            닫기
        </button>

    </div>

</div>

<div id="markerPopup" class="popup hidden">

    <div class="popupBox">

        <h2>🛠️ 마커 관리</h2>


        <!-- =========================
             기본 마커
        ========================== -->

        <h3>기본 마커</h3>

        <div id="markerList"></div>


        <!-- =========================
             사용자 마커
        ========================== -->

        <h3>사용자 마커</h3>

        <div id="customMarkerList"></div>


        <!-- =========================
             마커 수정
        ========================== -->

        <div id="markerEditArea" style="display:none;">

            <h3>마커 수정</h3>

            <label>
                아이콘
                <input id="editMarkerIcon">
            </label>

            <label>
                이름
                <input id="editMarkerName">
            </label>

            <button id="markerSaveBtn">
                저장
            </button>

            <button id="markerCancelBtn">
                취소
            </button>

            <button id="markerDeleteBtn">
                삭제
            </button>

        </div>


        <!-- =========================
             새 마커 추가
        ========================== -->

        <button id="addMarkerBtn">
            ➕ 마커 추가
        </button>


        <div id="markerAddArea" style="display:none;">

            <h3>새 마커 추가</h3>

            <label>
                아이콘
                <input
                    id="newMarkerIcon"
                    placeholder="예: 🔧">
            </label>

            <label>
                이름
                <input
                    id="newMarkerName"
                    placeholder="예: 점검">
            </label>

            <button id="markerAddSaveBtn">
                추가
            </button>

            <button id="markerAddCancelBtn">
                취소
            </button>

        </div>


        <!-- =========================
             닫기
        ========================== -->

        <button id="markerCloseBtn">
            닫기
        </button>

    </div>

</div>

<script>

if("serviceWorker" in navigator){

    navigator.serviceWorker.register("./service-worker.js")
    .then(function(registration){

        console.log("HomeCare 앱 저장 완료", registration);

    })
    .catch(function(error){

        console.log("Service Worker 오류", error);

    });

}


</script>


<button id="topButton">
    ⬆
</button>

<script src="record.js"></script>

<style>
/* ===============================
   공간 관리 팝업
================================ */

#spaceDetailPopup .popupBox {
    width: min(90vw, 360px);
    padding: 22px;
    box-sizing: border-box;
}

#spaceDetailPopup #spaceDetailTitle {
    margin: 0 0 20px;
    text-align: center;
}

/* 공간 관리 버튼 전체 */
#spaceDetailPopup button {
    width: 100%;
    min-height: 46px;
    margin-top: 10px;
    padding: 10px 14px;

    border: 1px solid #ddd;
    border-radius: 10px;

    background: #fff;
    font-size: 15px;
    font-weight: 500;

    cursor: pointer;
}

/* 닫기 버튼 */

#spaceDetailPopup #spaceDetailCloseBtn {
    width: 100%;
    min-height: 46px;
    margin-top: 20px;
    padding: 10px 14px;

    border: 1px solid #ddd;
    border-radius: 10px;

    background: #f5f5f5;
    font-size: 15px;
    font-weight: 500;
}

#spaceDetailPopup #spaceDetailCloseBtn {
    width: 40% !important;
    height: 42px !important;

    display: block;
    margin: 20px auto 0 !important;

    padding: 8px 14px;
    box-sizing: border-box;

    border: 1px solid #ddd;
    border-radius: 10px;

    background: #f5f5f5;
    font-size: 15px;
    font-weight: 500;
}

/* 공간 목록 팝업 - 닫기 */

#floorManageCloseBtn {
    width: 40% !important;
    height: 42px !important;

    display: block;
    margin: 20px auto 0 !important;

    padding: 8px 14px;
    box-sizing: border-box;

    border: 1px solid #ddd;
    border-radius: 10px;

    background: #f5f5f5;
    font-size: 15px;
    font-weight: 500;
}

</style>

</body>
</html>
