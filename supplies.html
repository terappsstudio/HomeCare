<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HomeCare - 생필품 관리</title>

<link rel="stylesheet" href="supplies.css">

</head>


<body>

<div id="appContainer">


    <!-- ===================================================
         HEADER
    =================================================== -->

  <header>

    <div class="logo" id="homeCareBtn">
        🏠 HomeCare
    </div>

    <button id="settingBtn">
        ⚙️
    </button>

</header>

    <!-- ===================================================
         PAGE TITLE
    =================================================== -->

    <h1 class="page-title">
        🛒 생필품 관리
    </h1>


    <!-- ===================================================
         생필품 요약
    =================================================== -->

    <section id="suppliesSummary">

        <div class="supplySummaryCard">

            <span>
                🛒 관리 중
            </span>

            <strong id="supplyTotalCount">
                0
            </strong>

            <small>
                개
            </small>

        </div>


        <div class="supplySummaryCard">

            <span>
                ⚠️ 재고 부족
            </span>

            <strong id="supplyLowCount">
                0
            </strong>

            <small>
                개
            </small>

        </div>

    </section>


    <!-- ===================================================
         생필품 추가
    =================================================== -->

    <section id="supplyToolbar">

        <button id="addSupplyBtn">
            ＋ 생필품 추가
        </button>

    </section>


    <!-- ===================================================
         생필품 목록
    =================================================== -->

    <section id="supplyListSection">

        <h2>
            📋 생필품 목록
        </h2>


        <div id="supplyList">

            <!-- 생필품 목록이 여기에 표시됨 -->

        </div>

    </section>


    <!-- ===================================================
         생필품 추가 / 수정 팝업
    =================================================== -->

    <div
        id="supplyPopup"
        class="popup hidden"
    >

        <div class="popupBox">

            <h2 id="supplyPopupTitle">
                생필품 추가
            </h2>


            <!-- 제품명 -->

            <label>

                제품명

                <input
                    type="text"
                    id="supplyName"
                    placeholder="예: 화장지"
                >

            </label>


            <!-- 현재 수량 -->

            <label>

                현재 수량

                <input
                    type="number"
                    id="supplyQuantity"
                    min="0"
                    value="0"
                >

            </label>


            <!-- 적정 수량 -->

            <label>

                적정 수량

                <input
                    type="number"
                    id="supplyMinQuantity"
                    min="0"
                    value="1"
                >

            </label>


            <!-- 보관 위치 -->

            <label>

                보관 위치

                <input
                    type="text"
                    id="supplyLocation"
                    placeholder="예: 펜트리"
                >

            </label>


            <!-- 메모 -->

            <label>

                메모

                <input
                    type="text"
                    id="supplyMemo"
                    placeholder="필요한 경우 입력"
                >

            </label>


            <!-- 버튼 -->

            <div class="popupButtons">

                <button id="supplySaveBtn">
                    저장
                </button>

                <button id="supplyCancelBtn">
                    취소
                </button>

            </div>

        </div>

    </div>


    <!-- ===================================================
         뒤로가기
    =================================================== -->

    <button id="backHomeBtn">

        <span class="backIcon">
            👈
        </span>

        <span class="backText">
            뒤로가기
        </span>

    </button>


</div>


<script src="supplies.js"></script>

</body>

</html>
