<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HomeCare - 생필품 관리</title>

    <link
        rel="stylesheet"
        href="supplies.css"
    >

</head>


<body>

<div id="appContainer">


    <!-- ===================================================
         HEADER
    =================================================== -->

    <header>

        <div
            class="logo"
            id="homeCareBtn"
        >
            🏠 HomeCare
        </div>


        <button id="settingBtn">
            ⚙️
        </button>

    </header>

    <!-- ===================================================
         설정 팝업
    =================================================== -->

    <div
        id="settingsPopup"
        class="popup hidden"
    >

        <div class="popupBox">

            <h2>
                ⚙️ 설정
            </h2>


            <button
                id="storageSettingsBtn"
                class="settingsMenuBtn"
            >
                📍 보관 장소 관리
            </button>


            <button
                id="settingsCloseBtn"
                class="settingsCloseBtn"
            >
                닫기
            </button>

        </div>

    </div>

    <!-- ===================================================
         PAGE TITLE
    =================================================== -->

    <h1 class="page-title">
        🛒 생필품
    </h1>



    <!-- ===================================================
         생필품 요약
    =================================================== -->

    <section id="suppliesSummary">


        <!-- 전체 -->

        <div class="supplySummaryCard">

            <span>
                📦 전체
            </span>

            <strong id="supplyTotalCount">
                0
            </strong>

            <small>
                종
            </small>

        </div>


        <!-- 구매 필요 -->

        <div class="supplySummaryCard">

            <span>
                🛒 구매 필요
            </span>

            <strong id="supplyLowCount">
                0
            </strong>

            <small>
                종
            </small>

        </div>


    </section>


    <!-- ===================================================
         생필품 추가
    =================================================== -->

    <section id="supplyToolbar">

        <button id="addSupplyBtn">
            ＋ 생필품 추가
        </button>

    </section>

<!-- ===================================================
     보관 장소
=================================================== -->

<section id="supplyLocationFilter">

<h2>
    📍 보관 장소
</h2>

    <div id="supplyLocationButtons">

        <!-- JS에서 자동 생성 -->

    </div>

</section>



<!-- ===================================================
     구매 필요
=================================================== -->

<section id="supplyNeedSection">

    <div class="sectionHeader">

        <h2>
            🛒 구매 필요
        </h2>

        <span id="supplyNeedCount">
            0
        </span>

    </div>


    <div id="supplyNeedList">

        <!-- 구매 필요한 생필품 -->

    </div>

</section>

    <!-- ===================================================
         생필품 목록
    =================================================== -->

    <section id="supplyListSection">

        <div class="sectionHeader">

            <h2>
                📦 전체 생필품
            </h2>

        </div>


        <div id="supplyList">

            <!-- 생필품 목록이 여기에 표시됨 -->

        </div>

    </section>

        <!-- ===================================================
         보관 장소 관리 팝업
    =================================================== -->

    <div
        id="storageManagePopup"
        class="popup hidden"
    >

        <div class="popupBox">

            <h2>
                📍 보관 장소 관리
            </h2>


            <div id="storageManageList">

                <!-- JS에서 자동 생성 -->

            </div>


            <button
                id="addStorageLocationBtn"
                class="addStorageLocationBtn"
            >
                ＋ 보관 장소 추가
            </button>


            <div class="popupButtons">

                <button
                    id="storageCloseBtn"
                    class="storageCloseBtn"
                >
                    닫기
                </button>

            </div>

        </div>

    </div>

    <!-- ===================================================
         생필품 추가 / 수정 팝업
    =================================================== -->

    <div
        id="supplyPopup"
        class="popup hidden"
    >

        <div class="popupBox">


            <h2 id="supplyPopupTitle">
                생필품 추가
            </h2>



            <!-- 제품명 -->

            <label>

                제품명

                <input
                    type="text"
                    id="supplyName"
                    placeholder="예: 에탄올"
                >

            </label>



            <!-- 규격 -->

            <label>

                규격

                <input
                    type="text"
                    id="supplySpec"
                    placeholder="예: 4L, 18L, 30롤"
                >

            </label>



            <!-- 현재 수량 -->

            <label>

                현재 수량

                <input
                    type="number"
                    id="supplyQuantity"
                    min="0"
                    value="0"
                >

            </label>



            <!-- 구매 필요 기준 -->

            <label>

                구매 필요 기준

                <input
                    type="number"
                    id="supplyMinQuantity"
                    min="0"
                    value="1"
                >

            </label>

<!-- 보관 위치 -->

<label>

    보관 위치

    <select id="supplyLocation">

        <!-- JS에서 자동 생성 -->

    </select>

</label>

            <!-- 메모 -->

            <label>

                메모

                <input
                    type="text"
                    id="supplyMemo"
                    placeholder="필요한 경우 입력"
                >

            </label>



            <!-- 버튼 -->

            <div class="popupButtons">

                <button id="supplySaveBtn">
                    저장
                </button>


                <button id="supplyCancelBtn">
                    취소
                </button>

            </div>


        </div>

    </div>



    <!-- ===================================================
         뒤로가기
    =================================================== -->

    <button id="backHomeBtn">

        <span class="backIcon">
            👈
        </span>


        <span class="backText">
            뒤로가기
        </span>

    </button>


</div>



<script src="supplies.js"></script>

</body>

</html>
