<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HomeCare</title>

<link rel="stylesheet" href="main.css">

</head>

<body>

<div class="container">

    <!-- ===============================
         HEADER
    =============================== -->

    <header>

        <h1>🏠 HomeCare</h1>

        <p>우리집 홈케어 관리</p>

    </header>


    <!-- ===============================
         생활용품 요약
    =============================== -->

    <section class="summary">

        <div class="summaryCard">

            <div class="title">
                🔄 교체해야 하는 것
            </div>

            <div id="replaceNeedCount">
                0개
            </div>

        </div>


        <div class="summaryCard">

            <div class="title">
                📦 곧 재고 떨어지는 것
            </div>

            <div id="stockLowCount">
                0개
            </div>

        </div>

    </section>


    <!-- ===============================
         메인 메뉴
    =============================== -->

    <section class="menu">

        <!-- 기록관리 -->

        <button id="recordBtn">

            📋<br>
            기록관리

        </button>


        <!-- 통계 -->

        <button id="statsBtn">

            📊<br>
            통계

        </button>


        <!-- 생활용품 -->
         
<!-- 생활용품 관리 -->

<button id="dailyGoodsBtn">

    🧺<br>
    생활용품 관리

</button>

        <!-- 설정 -->

        <button id="settingBtn">

            ⚙<br>
            설정

        </button>

    </section>

</div>


<script src="main.js"></script>

</body>
</html>
