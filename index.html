<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HomeCare</title>

<link rel="stylesheet" href="main.css">

</head>

<body>

<div class="container">

    <header>

        <h1>🏠 HomeCare</h1>

        <p>우리집 홈케어 관리</p>

    </header>


    <section class="summary">

        <div class="summaryCard">

            <div class="title">
                오늘 교체
            </div>

            <div id="todayCount">
                0개
            </div>

        </div>


        <div class="summaryCard">

            <div class="title">
                이번주 교체
            </div>

            <div id="weekCount">
                0개
            </div>

        </div>

    </section>



    <section class="menu">

        <button id="recordBtn">
            📋<br>
            기록관리
        </button>

        <button id="statsBtn">
            📊<br>
            통계
        </button>

        <button id="settingBtn">
            ⚙<br>
            설정
        </button>

    </section>



    <section class="recent">

        <h2>최근 등록</h2>

        <div id="recentList">

            아직 등록된 제품이 없습니다.

        </div>

    </section>

</div>

<script src="main.js"></script>

</body>
</html>
